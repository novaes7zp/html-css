<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo de Formulario</h1>

    <form action="cadastro.php" method="post" autocomplete="on">

        <p>
            <label for="icor">Cor: </label>
            <input type="color" name="color" id="icor" value="#00ff00">
        </p>

        <p>
            <label for="inivel">Nivel de Satisfação do atendimento</label>
            <input type="range" name="nivel" id="inivel" min="1" max="6" value="2">
        </p>

        <p>
            <label for="ifile">Escolher uma imagem</label>
            <input type="file" name="file" id="ifile">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
